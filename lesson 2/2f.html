<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge exercise</title>
    <style>
        .amazon-link{
            color: rgb(0, 113, 133);
            
        }
        .price-css{
            color: rgb(0, 118, 0);
            font-weight: bold;
        }

        .add-cart{
            background-color: rgb(255, 216, 20);
            width: 100px;
            height: 30px;
            border-radius: 40px;
            padding: 8px;
            margin-right: 10px;
        }

        .buy-button{
            background-color: rgb(255, 164, 28);
            width: 100px;
            height: 30px;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.com" class="amazon-link">Back to Amazon</a>
    <h2>Nike Black Running Shoes</h2>
    <h3 class="price-css">$39 - in stock</h3>
    <p>Free delivery tomorrow</p>
    <button class="add-cart">Add to cart</button>
    <button class="buy-button">Buy now</button>
</body>
</html>

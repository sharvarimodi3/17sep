<!-- create a link to google.com -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscriber-button
        {
            background-color:crimson;
            color:rgb(255,255,255);
            border: none;
            height: 36px;
            width:105px;
            border-radius:2px;
            cursor: pointer;
            margin-right:8px;
            padding: 100px;
        }

        .join-button{
            background-color: white;
            border-color: rgb(41, 56, 78);
            border-style: solid;
            border-width: 1px;
            color: rgb(41, 118, 211);
            height: 36px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;

            transition: background-color 0.15s,
            color 0.15s;
        }
        .join-button:hover{
            background-color: rgb(41, 118, 211);
            color: white;
        }

        .tweet-button{
            background-color: rgb(56, 130, 233);
            color:rgb(255,255, 255);
            border:none;
            height: 36px;
            width: 74px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
            transition: box0shadow 0.15s;
        }

        .tweet-button:hover{
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
            /* box-shadow: toTheRight  down/vertical  blurr */
            /* a: opacity in the color */
        }

    </style>
 </head>
 <body>
    <button class="subscriber-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">TWEET</button>
 </body>
 </html>
